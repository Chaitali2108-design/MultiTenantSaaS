<!DOCTYPE html>
<html>
<head>
    <title>Organization Registration</title>
</head>

<body>

<h2>Register Organization</h2>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}


<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Register
    </button>

</form>

</body>
</html>
