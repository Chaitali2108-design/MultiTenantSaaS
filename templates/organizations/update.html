{% extends "base.html" %}

{% block title %}
Update Organization
{% endblock %}

{% block content %}
<script src="https://cdn.tailwindcss.com"></script>


<div class="min-h-screen bg-gray-100 py-8">

    <div class="max-w-3xl mx-auto px-6">

        <div class="bg-white border border-gray-200 rounded-xl shadow-lg">

            <div class="px-8 py-6 border-b border-gray-200">

                <h1 class="text-3xl font-bold text-gray-900">
                    Update Organization
                </h1>

                <p class="text-gray-600 mt-2">
                    Update <strong>{{ organization.name }}</strong>
                </p>

            </div>

            <div class="p-8">

                <form method="post" enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="space-y-5">

                        {{ form.as_p }}

                    </div>

                    <div class="flex gap-4 mt-8">

                        <button
                            type="submit"
                            class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold transition"
                        >
                            Update Organization
                        </button>

                        <a
                            href="{% url 'organization_detail' organization.id %}"
                            class="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-900 rounded-lg font-semibold transition"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
