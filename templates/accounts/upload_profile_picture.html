{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>


<div class="min-h-screen bg-[#0F0B16] text-white flex items-center justify-center px-4 py-10">


<div class="w-full max-w-xl">


    <div class="bg-[#1A1525]/95 backdrop-blur-lg border border-white/10 rounded-2xl shadow-2xl overflow-hidden">



        <!-- Header -->


        <div class="px-8 py-6 border-b border-white/10 text-center">


            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center">


                <svg
                    class="w-8 h-8 text-cyan-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                    </path>

                </svg>


            </div>



            <h2 class="text-3xl font-bold">

                Upload Profile Picture

            </h2>


            <p class="text-gray-400 mt-2">

                Add a profile image to personalize your account.

            </p>


        </div>





        <!-- Form -->


        <div class="p-8">


            <form method="post" enctype="multipart/form-data" class="space-y-6">


                {% csrf_token %}



                <div
                class="text-white

                [&_p]:mb-5

                [&_label]:block
                [&_label]:text-sm
                [&_label]:font-medium
                [&_label]:text-gray-300
                [&_label]:mb-2


                [&_input]:w-full
                [&_input]:px-4
                [&_input]:py-3
                [&_input]:rounded-xl
                [&_input]:bg-[#241D32]
                [&_input]:border
                [&_input]:border-white/10
                [&_input]:text-white
                [&_input]:file:bg-cyan-500
                [&_input]:file:text-black
                [&_input]:file:border-0
                [&_input]:file:px-4
                [&_input]:file:py-2
                [&_input]:file:rounded-lg
                [&_input]:focus:outline-none
                [&_input]:focus:ring-2
                [&_input]:focus:ring-cyan-500/60
                ">


                    {{ form.as_p }}


                </div>




                <button

                    type="submit"

                    class="w-full bg-cyan-500 hover:bg-cyan-600 text-black font-semibold py-3 rounded-xl transition duration-300 shadow-lg"

                >

                    Upload Picture

                </button>



            </form>





            <div class="mt-6 text-center">


                <a

                href="{% url 'profile' %}"

                class="inline-block px-6 py-3 rounded-xl bg-[#241D32] border border-white/10 hover:border-cyan-400 transition text-gray-200"

                >

                    Back to Profile

                </a>


            </div>



        </div>



    </div>


</div>


</div>


{% endblock %}
