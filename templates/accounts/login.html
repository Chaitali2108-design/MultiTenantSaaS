{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <h1>
            Multi-Tenant SaaS
        </h1>


        <p>
            Sign in to continue
        </p>



        <form method="post" autocomplete="off">

            {% csrf_token %}


            <input 
                type="text"
                name="username"
                placeholder="Username"
                required
            >



            <input 
                type="password"
                name="password"
                placeholder="Password"
                required
            >



            <button type="submit">

                Login

            </button>


        </form>



        <p>

            <a href="{% url 'password_reset' %}">
                Forgot Password?
            </a>

        </p>



        {% if messages %}

            {% for message in messages %}

                <p>
                    {{ message }}
                </p>

            {% endfor %}

        {% endif %}



    </div>


</div>


</body>

</html>
