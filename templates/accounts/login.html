{% load static %}

<!DOCTYPE html>
<html>

<head>

<title>
Login | Multi-Tenant SaaS
</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>

body{
font-family:'Plus Jakarta Sans',sans-serif;
}


.login-card{
opacity:0;
transform:translateY(40px);
animation:show .8s cubic-bezier(.16,1,.3,1) forwards;
}


@keyframes show{

to{
opacity:1;
transform:translateY(0);
}

}


.float-btn{
transition:.3s ease;
}


.float-btn:hover{
transform:translateY(-3px);
}


</style>

</head>



<body class="min-h-screen bg-[#FAFBF9] flex items-center justify-center px-5 relative overflow-hidden">


<div class="absolute top-0 right-0 w-96 h-96 bg-[#069494]/10 blur-3xl rounded-full"></div>

<div class="absolute bottom-0 left-0 w-72 h-72 bg-[#0F766E]/10 blur-3xl rounded-full"></div>




<a
href="{% url 'signup' %}"
class="
fixed
top-6
right-6
px-5
py-2.5
rounded-xl
bg-[#0F766E]
text-white
text-sm
font-semibold
shadow-lg
float-btn
hover:bg-[#115E59]
"
>
+ Create Organization
</a>




<div class="w-full max-w-md relative">



<div class="login-card bg-white border border-[#E5E7EB] rounded-[32px] shadow-xl p-8">



<!-- Header -->

<div class="text-center mb-7">


<div class="
w-16
h-16
mx-auto
mb-5
rounded-2xl
bg-[#E8F8F7]
flex
items-center
justify-center
">

<span class="text-3xl">
🏢
</span>

</div>



<h1 class="
text-3xl
font-extrabold
text-[#102A2A]
">

Multi-Tenant SaaS

</h1>



<p class="mt-2 text-[#718096]">

Sign in to continue

</p>


</div>





<form method="post" autocomplete="off" class="space-y-5">


{% csrf_token %}



<div>

<label class="block text-sm font-semibold text-[#425466] mb-2">

Username

</label>


<input
type="text"
name="username"
placeholder="Enter your username"
autocomplete="new-username"
required

class="
w-full
px-4
py-3
rounded-xl
border
border-[#E5E7EB]
bg-[#FAFBF9]
text-[#102A2A]
outline-none
transition
focus:bg-white
focus:border-[#069494]
focus:ring-4
focus:ring-[#069494]/10
"
>

</div>




<div>


<label class="block text-sm font-semibold text-[#425466] mb-2">

Password

</label>


<input
type="password"
name="password"
placeholder="Enter your password"
autocomplete="new-password"
required

class="
w-full
px-4
py-3
rounded-xl
border
border-[#E5E7EB]
bg-[#FAFBF9]
text-[#102A2A]
outline-none
transition
focus:bg-white
focus:border-[#069494]
focus:ring-4
focus:ring-[#069494]/10
"
>


</div>





<button

type="submit"

class="
w-full
py-3
rounded-xl
bg-[#0F766E]
text-white
font-semibold
shadow-lg
hover:bg-[#115E59]
hover:-translate-y-1
transition
duration-300
"

>

Login

</button>



</form>





<div class="text-center mt-5">


<a

href="{% url 'password_reset' %}"

class="
text-sm
text-[#0F766E]
font-semibold
hover:text-[#115E59]
"

>

Forgot Password?

</a>


</div>




{% if messages %}

<div class="mt-5 space-y-2">

{% for message in messages %}

<div class="
px-4
py-3
rounded-xl
bg-red-50
border
border-red-100
text-red-600
text-sm
">

{{ message }}

</div>

{% endfor %}

</div>

{% endif %}



</div>



<p class="
text-center
text-sm
text-[#718096]
mt-5
">

Secure organization management platform

</p>


</div>


</body>

</html>
