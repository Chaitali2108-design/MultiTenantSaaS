<!DOCTYPE html>
<html>

<head>

    <title>Login | Multi-Tenant SaaS</title>

    <script src="https://cdn.tailwindcss.com"></script>

    

</head>


<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4">


<a
    href="{% url 'signup' %}"
    class="
    fixed
    top-6
    right-6
    px-3.5
    py-2.5
    rounded-xl
    bg-teal-700
    border
    border-teal-800
    text-white
    text-sm
    font-semibold
    shadow-md
    hover:bg-teal-800
    hover:shadow-lg
    transition-all
    duration-300
    "
    style="
    font-family: 'Plus Jakarta Sans', sans-serif;
    "
>
    + Create Organization
</a>

<div class="w-full max-w-md">


    <div class="bg-white border border-slate-200 rounded-3xl shadow-xl p-8">


        <!-- Logo / Header -->

        <div class="text-center mb-8">


            <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-indigo-100 flex items-center justify-center">

                <span class="text-3xl">
                    🏢
                </span>

            </div>


            <h1 class="text-3xl font-bold text-slate-900">

                Multi-Tenant SaaS

            </h1>


            <p class="mt-2 text-slate-500">

                Sign in to continue

            </p>


        </div>




        <form method="post" autocomplete="off" class="space-y-5">


            {% csrf_token %}


            <div>


                <label class="block text-sm font-medium text-slate-700 mb-2">

                    Username

                </label>


                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="new-username"
                    required
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 outline-none transition focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"

                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    required
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 outline-none transition focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"
                >


            </div>




            <button

                type="submit"

                class="w-full py-3 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200"

            >

                Login

            </button>


        </form>




        <div class="text-center mt-6">


            <a

                href="{% url 'password_reset' %}"

                class="text-sm text-indigo-600 hover:text-indigo-700 font-medium"

            >

                Forgot Password?

            </a>


        </div>




        {% if messages %}


            <div class="mt-6 space-y-2">


            {% for message in messages %}


                <div class="px-4 py-3 rounded-xl bg-red-50 border border-red-100 text-red-600 text-sm">

                    {{ message }}

                </div>


            {% endfor %}


            </div>


        {% endif %}



    </div>



    <p class="text-center text-sm text-slate-400 mt-6">

        Secure organization management platform

    </p>


</div>


</body>

</html>
