{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>

<div class="min-h-screen bg-[#0F0B16] flex items-center justify-center px-4 py-10">


    <div class="max-w-xl w-full bg-[#1A1525]/95 backdrop-blur-lg border border-white/10 rounded-2xl shadow-2xl overflow-hidden">


        <!-- Header -->

        <div class="px-8 py-7 border-b border-white/10">


            <div class="flex items-center gap-4">


                <div class="w-14 h-14 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center">

                    <svg
                        class="w-7 h-7 text-amber-400"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24">

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                        </path>

                    </svg>

                </div>


                <div>

                    <h2 class="text-3xl font-bold text-white">
                        Reset Password
                    </h2>

                    <p class="text-gray-400 mt-1">
                        Enter your email to receive a password reset link.
                    </p>

                </div>


            </div>


        </div>



        <!-- Form -->

        <div class="p-8">


            <form method="post" class="space-y-6">


                {% csrf_token %}


                <div class="text-white

                    [&_p]:mb-5

                    [&_label]:block
                    [&_label]:text-sm
                    [&_label]:font-medium
                    [&_label]:text-gray-300
                    [&_label]:mb-2

                    [&_input]:w-full
                    [&_input]:px-4
                    [&_input]:py-3
                    [&_input]:rounded-xl
                    [&_input]:bg-[#241D32]
                    [&_input]:border
                    [&_input]:border-white/10
                    [&_input]:text-white
                    [&_input]:placeholder-gray-500
                    [&_input]:transition

                    [&_input]:focus:outline-none
                    [&_input]:focus:ring-2
                    [&_input]:focus:ring-amber-500/60
                    [&_input]:focus:border-amber-500
                ">

                    {{ form.as_p }}

                </div>



                <button
                    type="submit"
                    class="w-full bg-amber-500 hover:bg-amber-600 text-black font-semibold py-3 rounded-xl transition duration-300 shadow-lg">

                    Send Reset Link

                </button>


            </form>


        </div>


    </div>


</div>


{% endblock %}
