{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>


<div class="min-h-screen bg-gray-100 flex items-center justify-center px-4 py-10">



    <div class="max-w-xl w-full bg-white border border-gray-200 rounded-2xl shadow-xl overflow-hidden">



        <!-- Header -->


        <div class="px-8 py-7 border-b border-gray-200">



            <div class="flex items-center gap-4">



                <div class="w-14 h-14 rounded-xl bg-amber-100 border border-amber-200 flex items-center justify-center">


                    <svg
                        class="w-7 h-7 text-amber-500"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24">

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8">
                        </path>

                    </svg>


                </div>




                <div>


                    <h2 class="text-3xl font-bold text-gray-800">

                        Reset Password

                    </h2>



                    <p class="text-gray-500 mt-1">

                        Enter your email to receive a password reset link.

                    </p>



                </div>



            </div>



        </div>





        <!-- Form -->



        <div class="p-8">



            <form method="post" class="space-y-6">



                {% csrf_token %}




                <div class="text-gray-800


                    [&_p]:mb-5


                    [&_label]:block
                    [&_label]:text-sm
                    [&_label]:font-medium
                    [&_label]:text-gray-700
                    [&_label]:mb-2


                    [&_input]:w-full
                    [&_input]:px-4
                    [&_input]:py-3
                    [&_input]:rounded-xl
                    [&_input]:bg-white
                    [&_input]:border
                    [&_input]:border-gray-300
                    [&_input]:text-gray-800
                    [&_input]:placeholder-gray-400
                    [&_input]:transition


                    [&_input]:focus:outline-none
                    [&_input]:focus:ring-2
                    [&_input]:focus:ring-amber-500/60
                    [&_input]:focus:border-amber-500

                ">


                    {{ form.as_p }}


                </div>





                <button
                    type="submit"
                    class="w-full bg-amber-500 hover:bg-amber-600 text-black font-semibold py-3 rounded-xl transition duration-300 shadow-lg">


                    Send Reset Link


                </button>



            </form>



        </div>



    </div>



</div>


{% endblock %}
