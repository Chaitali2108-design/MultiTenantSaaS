{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>


<div class="min-h-screen bg-gray-100 flex items-center justify-center px-4 py-10">



    <div class="max-xl w-full bg-white border border-gray-200 rounded-2xl shadow-xl overflow-hidden">



        <!-- Header -->


        <div class="px-8 py-7 border-b border-gray-200">



            <div class="flex items-center gap-4">



                <div class="w-14 h-14 rounded-xl bg-cyan-100 border border-cyan-200 flex items-center justify-center">


                    <svg
                        class="w-7 h-7 text-cyan-600"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24">


                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-3a1 1 0 011-1h2.586l6.414-6.414A6 6 0 0121 9z">
                        </path>


                    </svg>


                </div>




                <div>


                    <h2 class="text-3xl font-bold text-gray-800">

                        Set New Password

                    </h2>




                    <p class="text-gray-500 mt-1">

                        Create a new password for your account.

                    </p>



                </div>



            </div>



        </div>





        <!-- Form -->



        <div class="p-8">



            <form method="post" class="space-y-6">



                {% csrf_token %}





                <div class="text-gray-800


                    [&_p]:mb-5


                    [&_label]:block
                    [&_label]:text-sm
                    [&_label]:font-medium
                    [&_label]:text-gray-700
                    [&_label]:mb-2


                    [&_input]:w-full
                    [&_input]:px-4
                    [&_input]:py-3
                    [&_input]:rounded-xl
                    [&_input]:bg-white
                    [&_input]:border
                    [&_input]:border-gray-300
                    [&_input]:text-gray-800
                    [&_input]:placeholder-gray-400
                    [&_input]:transition


                    [&_input]:focus:outline-none
                    [&_input]:focus:ring-2
                    [&_input]:focus:ring-cyan-500/60
                    [&_input]:focus:border-cyan-500

                ">



                    {{ form.as_p }}



                </div>





                <button
                    type="submit"
                    class="w-full bg-cyan-500 hover:bg-cyan-600 text-black font-semibold py-3 rounded-xl transition duration-300 shadow-lg">


                    Change Password


                </button>



            </form>



        </div>



    </div>



</div>



{% endblock %}
