{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>

<div class="min-h-screen bg-[#0F0B16] flex items-center justify-center px-4 py-10">


    <div class="max-w-md w-full bg-[#1A1525]/95 backdrop-blur-lg border border-white/10 rounded-2xl shadow-2xl">


        <div class="p-8 text-center">


            <!-- Information Icon -->

            <div class="w-20 h-20 mx-auto rounded-full bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center mb-6">


                <svg
                    class="w-10 h-10 text-cyan-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M13 16h-1v-4h-1m1-4h.01M12 2a10 10 0 100 20 10 10 0 000-20z">
                    </path>

                </svg>


            </div>



            <h2 class="text-3xl font-bold text-white">

                Password Reset Email Sent

            </h2>



            <p class="text-gray-400 mt-4 leading-relaxed">

                Check your email for instructions to reset your password.

            </p>



        </div>


    </div>


</div>


{% endblock %}
