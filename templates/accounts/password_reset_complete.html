{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>

<div class="min-h-screen bg-[#0F0B16] flex items-center justify-center px-4 py-10">


    <div class="max-w-md w-full bg-[#1A1525]/95 backdrop-blur-lg border border-white/10 rounded-2xl shadow-2xl overflow-hidden">


        <!-- Success Section -->

        <div class="p-8 text-center">


            <div class="w-20 h-20 mx-auto rounded-full bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center mb-6">


                <svg
                    class="w-10 h-10 text-emerald-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M5 13l4 4L19 7">
                    </path>

                </svg>


            </div>



            <h2 class="text-3xl font-bold text-white">

                Password Changed Successfully

            </h2>


            <p class="text-gray-400 mt-3">

                Your password has been updated. You can now sign in with your new password.

            </p>



            <a
                href="{% url 'login' %}"
                class="inline-block mt-8 w-full bg-emerald-500 hover:bg-emerald-600 text-black font-semibold py-3 rounded-xl transition duration-300 shadow-lg">

                Login

            </a>


        </div>


    </div>


</div>


{% endblock %}
