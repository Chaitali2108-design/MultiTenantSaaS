{% extends "base.html" %}

{% block content %}

<div class="min-h-screen bg-slate-50 flex items-center justify-center">

<div class="bg-white rounded-3xl shadow-xl border p-8 max-w-md text-center">


<div class="text-5xl mb-5">
⚠️
</div>


<h1 class="text-2xl font-bold">
Delete Invitation?
</h1>


<p class="text-slate-500 mt-3">
Are you sure you want to delete the invitation sent to:
</p>


<p class="font-semibold mt-2">
{{ invitation.email }}
</p>


<form method="post" class="mt-8 flex gap-4">

{% csrf_token %}


<a
href="{% url 'invitation_list' %}"
class="flex-1 py-3 rounded-xl border"
>
Cancel
</a>


<button
class="flex-1 py-3 rounded-xl bg-red-600 text-white"
>
Delete
</button>


</form>


</div>

</div>

{% endblock %}
