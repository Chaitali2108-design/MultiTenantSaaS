{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>


<div class="min-h-screen bg-gray-100 py-10 px-4">


    <div class="max-w-xl mx-auto">


        <div class="bg-white border border-gray-200 rounded-2xl shadow-xl overflow-hidden">



            <!-- Header -->


            <div class="px-8 py-6 border-b border-gray-200">



                <div class="flex items-center gap-3">



                    <div class="w-12 h-12 rounded-xl bg-amber-100 border border-amber-200 flex items-center justify-center">


                        <span class="text-2xl">
                            🔒
                        </span>


                    </div>





                    <div>



                        <h2 class="text-3xl font-bold text-gray-800">

                            Change Password

                        </h2>





                        <p class="text-gray-500 mt-1">

                            Keep your account secure with a strong password.

                        </p>



                    </div>



                </div>



            </div>





            <!-- Form -->



            <div class="p-8">



                <form method="post" class="space-y-6">



                    {% csrf_token %}





                    <div class="text-gray-800


                        [&_p]:mb-5


                        [&_label]:block
                        [&_label]:text-sm
                        [&_label]:font-medium
                        [&_label]:text-gray-700
                        [&_label]:mb-2


                        [&_input]:w-full
                        [&_input]:px-4
                        [&_input]:py-3
                        [&_input]:rounded-xl
                        [&_input]:bg-white
                        [&_input]:border
                        [&_input]:border-gray-300
                        [&_input]:text-gray-800
                        [&_input]:placeholder-gray-400
                        [&_input]:transition


                        [&_input]:focus:outline-none
                        [&_input]:focus:ring-2
                        [&_input]:focus:ring-amber-500/60
                        [&_input]:focus:border-amber-500

                    ">



                        {{ form.as_p }}



                    </div>





                    <button
                        type="submit"
                        class="w-full bg-amber-500 hover:bg-amber-600 text-black font-semibold py-3 rounded-xl transition duration-300 shadow-lg">


                        Update Password


                    </button>



                </form>



            </div>



        </div>





        <p class="text-center text-gray-500 text-sm mt-6">

            Your password helps protect your account and organization data.

        </p>





    </div>



</div>



{% endblock %}
