{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>

<div class="min-h-screen bg-[#0F0B16] py-10 px-4">

    <div class="max-w-xl mx-auto">

        <div class="bg-[#1A1525]/95 backdrop-blur-lg border border-white/10 rounded-2xl shadow-2xl overflow-hidden">


            <!-- Header -->

            <div class="px-8 py-6 border-b border-white/10">

                <div class="flex items-center gap-3">

                    <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center">

                        <span class="text-2xl">
                            🔒
                        </span>

                    </div>


                    <div>

                        <h2 class="text-3xl font-bold text-white">
                            Change Password
                        </h2>

                        <p class="text-gray-400 mt-1">
                            Keep your account secure with a strong password.
                        </p>

                    </div>

                </div>

            </div>


            <!-- Form -->

            <div class="p-8">

                <form method="post" class="space-y-6">

                    {% csrf_token %}


                    <div class="text-white

                        [&_p]:mb-5

                        [&_label]:block
                        [&_label]:text-sm
                        [&_label]:font-medium
                        [&_label]:text-gray-300
                        [&_label]:mb-2

                        [&_input]:w-full
                        [&_input]:px-4
                        [&_input]:py-3
                        [&_input]:rounded-xl
                        [&_input]:bg-[#241D32]
                        [&_input]:border
                        [&_input]:border-white/10
                        [&_input]:text-white
                        [&_input]:placeholder-gray-500
                        [&_input]:transition

                        [&_input]:focus:outline-none
                        [&_input]:focus:ring-2
                        [&_input]:focus:ring-amber-500/60
                        [&_input]:focus:border-amber-500
                    ">

                        {{ form.as_p }}

                    </div>


                    <button
                        type="submit"
                        class="w-full bg-amber-500 hover:bg-amber-600 text-black font-semibold py-3 rounded-xl transition duration-300 shadow-lg">

                        Update Password

                    </button>


                </form>

            </div>


        </div>


        <p class="text-center text-gray-500 text-sm mt-6">
            Your password helps protect your account and organization data.
        </p>


    </div>

</div>

{% endblock %}
