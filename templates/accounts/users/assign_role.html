{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>


<div class="min-h-screen bg-gray-100 flex items-center justify-center px-6 py-10">


    <div class="w-full max-w-xl">


        <div class="bg-white border border-gray-200 rounded-xl shadow-xl overflow-hidden">



            <!-- Header -->


            <div class="px-7 py-6 border-b border-gray-200">


                <h2 class="text-2xl font-semibold text-gray-800">

                    Assign Role

                </h2>


                <p class="text-gray-500 text-sm mt-2">

                    Manage role access and permissions for this user.

                </p>


            </div>





            <!-- Content -->


            <div class="p-7">


                <!-- User Info -->


                <div class="bg-gray-50 border border-gray-200 rounded-xl px-5 py-4 mb-6">


                    <p class="text-gray-500 text-sm">

                        User

                    </p>


                    <p class="text-lg font-medium mt-1 text-gray-800">

                        {{ user.username }}

                    </p>


                </div>





                <form method="POST" class="space-y-6">


                    {% csrf_token %}



                    <div
                    class="text-gray-800

                    [&_p]:mb-5

                    [&_label]:block
                    [&_label]:text-sm
                    [&_label]:font-medium
                    [&_label]:text-gray-700
                    [&_label]:mb-2


                    [&_select]:w-full
                    [&_select]:px-4
                    [&_select]:py-3
                    [&_select]:rounded-lg
                    [&_select]:bg-white
                    [&_select]:border
                    [&_select]:border-gray-300
                    [&_select]:text-gray-800
                    [&_select]:focus:outline-none
                    [&_select]:focus:ring-2
                    [&_select]:focus:ring-amber-400


                    [&_input]:w-full
                    [&_input]:px-4
                    [&_input]:py-3
                    [&_input]:rounded-lg
                    [&_input]:bg-white
                    [&_input]:border
                    [&_input]:border-gray-300
                    [&_input]:text-gray-800
                    [&_input]:focus:outline-none
                    [&_input]:focus:ring-2
                    [&_input]:focus:ring-amber-400

                    ">


                        {{ form.as_p }}


                    </div>





                    <button
                        type="submit"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg transition shadow-lg">

                        Save Role

                    </button>



                </form>







                <div class="mt-6">


                    <a

                    href="{% url 'user_list' %}"

                    class="block text-center px-5 py-3 rounded-lg bg-gray-100 border border-gray-300 text-gray-700 hover:bg-gray-200 transition"

                    >

                        Back to Users

                    </a>



                </div>



            </div>



        </div>



    </div>


</div>


{% endblock %}
