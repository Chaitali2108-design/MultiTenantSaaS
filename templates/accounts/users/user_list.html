<h2>Organization Users</h2>

<table border="1">

    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Action</th>
    </tr>

    {% for user in users %}

    <tr>

        <td>{{ user.username }}</td>

        <td>{{ user.email }}</td>

        <td>
            {% if user.role %}
                {{ user.role.name }}
            {% else %}
                No Role
            {% endif %}
        </td>

        <td>

            {% if user != request.user %}

                <a href="{% url 'assign_user_role' user.id %}">
                    Assign Role
                </a>

            {% else %}

                Current User

            {% endif %}

        </td>

    </tr>

    {% empty %}

    <tr>
        <td colspan="4">
            No users found.
        </td>
    </tr>

    {% endfor %}

</table>
