{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>


<div class="min-h-screen bg-[#0F0B16] text-white flex items-center justify-center px-4 py-10">


<div class="w-full max-w-2xl">


    <div class="bg-[#1A1525]/95 backdrop-blur-lg border border-white/10 rounded-2xl shadow-2xl overflow-hidden">


        <!-- Header -->

        <div class="px-8 py-6 border-b border-white/10 text-center">


            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center">


                <svg
                    class="w-8 h-8 text-cyan-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5">
                    </path>

                </svg>


            </div>


            <h2 class="text-3xl font-bold">
                Create Organization Account
            </h2>


            <p class="text-gray-400 mt-2">
                Register your organization and create your workspace.
            </p>


        </div>



        <!-- Form -->


        <div class="p-8">


            <form method="post" enctype="multipart/form-data" class="space-y-6">


                {% csrf_token %}



                <div
                class="text-white

                [&_p]:mb-5

                [&_label]:block
                [&_label]:text-sm
                [&_label]:font-medium
                [&_label]:text-gray-300
                [&_label]:mb-2


                [&_input]:w-full
                [&_input]:px-4
                [&_input]:py-3
                [&_input]:rounded-xl
                [&_input]:bg-[#241D32]
                [&_input]:border
                [&_input]:border-white/10
                [&_input]:text-white
                [&_input]:focus:outline-none
                [&_input]:focus:ring-2
                [&_input]:focus:ring-cyan-500/60


                [&_select]:w-full
                [&_select]:px-4
                [&_select]:py-3
                [&_select]:rounded-xl
                [&_select]:bg-[#241D32]
                [&_select]:border
                [&_select]:border-white/10
                [&_select]:text-white
                [&_select]:focus:outline-none
                [&_select]:focus:ring-2
                [&_select]:focus:ring-cyan-500/60


                [&_textarea]:w-full
                [&_textarea]:px-4
                [&_textarea]:py-3
                [&_textarea]:rounded-xl
                [&_textarea]:bg-[#241D32]
                [&_textarea]:border
                [&_textarea]:border-white/10
                [&_textarea]:text-white
                [&_textarea]:focus:outline-none
                [&_textarea]:focus:ring-2
                [&_textarea]:focus:ring-cyan-500/60
                ">


                    {{ form.as_p }}


                </div>



                <button
                    type="submit"
                    class="w-full bg-cyan-500 hover:bg-cyan-600 text-black font-semibold py-3 rounded-xl transition duration-300 shadow-lg">

                    Register Organization

                </button>



            </form>


        </div>


    </div>


</div>


</div>


{% endblock %}
