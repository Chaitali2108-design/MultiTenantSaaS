<html>

<script src="https://cdn.tailwindcss.com"></script>


<div class="min-h-screen bg-gray-100 text-gray-800 flex items-center justify-center px-4 py-10">


<div class="w-full max-w-2xl">


    <div class="bg-white border border-gray-200 rounded-2xl shadow-xl overflow-hidden">



        <!-- Header -->


        <div class="px-8 py-6 border-b border-gray-200 text-center">



            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-cyan-100 border border-cyan-200 flex items-center justify-center">


                <svg
                    class="w-8 h-8 text-cyan-600"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">


                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5">
                    </path>


                </svg>


            </div>



            <h2 class="text-3xl font-bold text-gray-800">

                Create Organization Account

            </h2>



            <p class="text-gray-500 mt-2">

                Register your organization and create your workspace.

            </p>


        </div>





        <!-- Form -->


        <div class="p-8">


            <form method="post" enctype="multipart/form-data" class="space-y-6">


                {% csrf_token %}




                <div
                class="text-gray-800

                [&_p]:mb-5


                [&_label]:block
                [&_label]:text-sm
                [&_label]:font-medium
                [&_label]:text-gray-700
                [&_label]:mb-2



                [&_input]:w-full
                [&_input]:px-4
                [&_input]:py-3
                [&_input]:rounded-xl
                [&_input]:bg-white
                [&_input]:border
                [&_input]:border-gray-300
                [&_input]:text-gray-800
                [&_input]:focus:outline-none
                [&_input]:focus:ring-2
                [&_input]:focus:ring-cyan-500/60



                [&_select]:w-full
                [&_select]:px-4
                [&_select]:py-3
                [&_select]:rounded-xl
                [&_select]:bg-white
                [&_select]:border
                [&_select]:border-gray-300
                [&_select]:text-gray-800
                [&_select]:focus:outline-none
                [&_select]:focus:ring-2
                [&_select]:focus:ring-cyan-500/60



                [&_textarea]:w-full
                [&_textarea]:px-4
                [&_textarea]:py-3
                [&_textarea]:rounded-xl
                [&_textarea]:bg-white
                [&_textarea]:border
                [&_textarea]:border-gray-300
                [&_textarea]:text-gray-800
                [&_textarea]:focus:outline-none
                [&_textarea]:focus:ring-2
                [&_textarea]:focus:ring-cyan-500/60
                ">


                    {{ form.as_p }}


                </div>




                <button

                    type="submit"

                    class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-lg">

                    Register Organization

                </button>




            </form>


        </div>


    </div>


</div>


</div>


</html>
