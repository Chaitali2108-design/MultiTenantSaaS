{% extends "base.html" %}

{% block title %}
Invite User
{% endblock %}


{% block content %}

<script src="https://cdn.tailwindcss.com"></script>


<link
href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">


<style>

body{
    font-family:'Plus Jakarta Sans',sans-serif;
}

</style>



<div class="min-h-screen bg-slate-50 px-6 py-10">



<div class="max-w-3xl mx-auto">



<!-- Header -->


<div class="bg-white rounded-3xl border border-slate-200 shadow-lg overflow-hidden">


<div class="h-1 bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-500"></div>



<div class="px-8 py-7 flex items-center justify-between">


<div>


<div class="
inline-flex
items-center
gap-2
px-3
py-1
rounded-full
bg-cyan-50
text-cyan-700
border
border-cyan-200
text-sm
font-semibold
">

👤 User Invitation

</div>



<h1 class="
text-3xl
font-extrabold
text-slate-900
mt-4
">

Invite New Member

</h1>



<p class="
text-slate-500
mt-2
">

Add a new user to your organization and assign access.

</p>


</div>





<div class="
w-14
h-14
rounded-2xl
bg-indigo-100
text-indigo-600
flex
items-center
justify-center
text-2xl
shadow-sm
">

+

</div>



</div>





<!-- Form -->


<form 
method="post"
class="p-8 space-y-6"
>


{% csrf_token %}




<div
class="

[&_p]:mb-5


[&_label]:block
[&_label]:text-sm
[&_label]:font-semibold
[&_label]:text-slate-700
[&_label]:mb-2


[&_input]:w-full
[&_input]:px-4
[&_input]:py-3
[&_input]:rounded-xl
[&_input]:bg-slate-50
[&_input]:border
[&_input]:border-slate-300
[&_input]:text-slate-900
[&_input]:outline-none
[&_input]:transition


[&_input]:focus:bg-white
[&_input]:focus:border-cyan-500
[&_input]:focus:ring-4
[&_input]:focus:ring-cyan-100



[&_select]:w-full
[&_select]:px-5
[&_select]:py-3.5
[&_select]:rounded-xl
[&_select]:bg-white
[&_select]:border
[&_select]:border-slate-300
[&_select]:text-slate-800
[&_select]:font-medium
[&_select]:cursor-pointer
[&_select]:shadow-sm
[&_select]:appearance-none
[&_select]:outline-none
[&_select]:transition-all


[&_select]:hover:border-indigo-400


[&_select]:focus:border-indigo-500
[&_select]:focus:ring-4
[&_select]:focus:ring-indigo-100

">


{{ form.as_p }}


</div>




<button
type="submit"
class="
w-full
py-3.5
rounded-xl
bg-gradient-to-r
from-cyan-500
to-teal-600
text-white
font-semibold
shadow-lg
shadow-cyan-200
hover:shadow-xl
hover:scale-[1.02]
transition
duration-300
"
>

Send Invitation →

</button>




<div class="
flex
items-center
justify-center
gap-2
text-sm
text-slate-500
pt-2
">


<span class="
w-2
h-2
rounded-full
bg-emerald-500
">
</span>


Invitation will be sent securely to the new member.


</div>




</form>


</div>


</div>


</div>


{% endblock %}
