{% extends "base.html" %}

{% block content %}
    <script src="https://cdn.tailwindcss.com"></script>


<div class="min-h-screen bg-gradient-to-br from-[#140F1F] via-[#251537] to-[#3B1D2E] py-10 px-4">

    <div class="max-w-3xl mx-auto">

        <div class="bg-[#1E1630]/90 backdrop-blur-lg border border-white/10 rounded-2xl shadow-2xl overflow-hidden">

            <!-- Header -->

            <div class="border-b border-white/10 px-8 py-6">

                <h2 class="text-3xl font-bold text-white">
                    Account Settings
                </h2>

                <p class="text-gray-400 mt-2">
                    Manage your personal account preferences and settings.
                </p>

            </div>

            <!-- Form -->

            <div class="p-8">

                <form method="post" class="space-y-6">

                    {% csrf_token %}

                    <div class="text-white

    [&_p]:mb-5

    [&_label]:block
    [&_label]:text-sm
    [&_label]:font-medium
    [&_label]:text-gray-300
    [&_label]:mb-2

    [&_input:not([type='checkbox'])]:w-full
    [&_input:not([type='checkbox'])]:px-4
    [&_input:not([type='checkbox'])]:py-3
    [&_input:not([type='checkbox'])]:rounded-xl
    [&_input:not([type='checkbox'])]:bg-[#2A203C]
    [&_input:not([type='checkbox'])]:border
    [&_input:not([type='checkbox'])]:border-gray-700
    [&_input:not([type='checkbox'])]:text-white
    [&_input:not([type='checkbox'])]:focus:outline-none
    [&_input:not([type='checkbox'])]:focus:ring-2
    [&_input:not([type='checkbox'])]:focus:ring-purple-500

    [&_select]:w-full
    [&_select]:px-4
    [&_select]:py-3
    [&_select]:rounded-xl
    [&_select]:bg-[#2A203C]
    [&_select]:border
    [&_select]:border-gray-700
    [&_select]:text-white

    [&_textarea]:w-full
    [&_textarea]:px-4
    [&_textarea]:py-3
    [&_textarea]:rounded-xl
    [&_textarea]:bg-[#2A203C]
    [&_textarea]:border
    [&_textarea]:border-gray-700
    [&_textarea]:text-white

    [&_input[type='checkbox']]:w-5
    [&_input[type='checkbox']]:h-5
    [&_input[type='checkbox']]:align-middle
">

                        {{ form.as_p }}

                    </div>

                    <div class="flex flex-col sm:flex-row gap-4 pt-4">

                        <button
                            type="submit"
                            class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-lg">

                            Save Settings

                        </button>

                        <a
                            href="{% url 'profile' %}"
                            class="flex-1 text-center bg-[#2A203C] hover:bg-[#35264B] text-white font-semibold py-3 rounded-xl transition duration-300 border border-gray-700">

                            Back to Profile

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
