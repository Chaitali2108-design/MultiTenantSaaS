{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>


<div class="min-h-screen bg-gray-100 py-10 px-4">


    <div class="max-w-2xl mx-auto">


        <div class="bg-white border border-gray-200 rounded-2xl p-8 shadow-xl">


            <!-- Header -->

            <div class="text-center mb-8">


                <div class="w-20 h-20 mx-auto rounded-full bg-green-100 border border-green-200 flex items-center justify-center mb-5">


                    <span class="text-4xl">
                        👤
                    </span>


                </div>



                <h1 class="text-3xl font-bold text-gray-800">

                    Accept Invitation

                </h1>



                <p class="text-gray-500 mt-2">

                    Complete your account to join the organization.

                </p>


            </div>



            <!-- Invitation Details -->


            <div class="space-y-5 mb-8">


                <div>

                    <label class="block text-sm font-medium text-gray-600 mb-2">

                        Email

                    </label>


                    <div class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800">

                        {{ invitation.email }}

                    </div>


                </div>




                <div>

                    <label class="block text-sm font-medium text-gray-600 mb-2">

                        Organization

                    </label>


                    <div class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800">

                        {{ invitation.organization.name }}

                    </div>


                </div>




                <div>

                    <label class="block text-sm font-medium text-gray-600 mb-2">

                        Role

                    </label>


                    <div class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800">

                        {{ invitation.role.name }}

                    </div>


                </div>


            </div>




            <!-- Registration Form -->


            <form method="post" class="space-y-6 invitation-form">


                {% csrf_token %}



                {{ form.as_p }}




                <button
                    type="submit"
                    class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-lg"
                >

                    Create Account

                </button>



            </form>



        </div>


    </div>


</div>



<style>


.invitation-form p {

    margin-bottom: 1.25rem;

}



.invitation-form label {

    display:block;

    margin-bottom:0.5rem;

    color:#4b5563;

    font-weight:500;

}



.invitation-form input {

    width:100%;

    background:white;

    border:1px solid #d1d5db;

    border-radius:0.75rem;

    padding:0.75rem 1rem;

    color:#111827;

}



.invitation-form input:focus {

    outline:none;

    border-color:#22c55e;

    box-shadow:0 0 0 3px rgba(34,197,94,0.2);

}



.invitation-form ul {

    color:#ef4444;

    font-size:0.875rem;

    margin-top:0.25rem;

}


</style>



{% endblock %}
