{% extends "base.html" %}

{% block content %}
<script src="https://cdn.tailwindcss.com"></script>


<div class="min-h-screen bg-[#140F1F] text-white">

    <div class="max-w-2xl mx-auto px-6 py-12">

        <div class="bg-white/5 border border-white/10 rounded-2xl p-8 shadow-xl">

            <!-- Header -->
            <div class="text-center mb-8">

                <div class="w-20 h-20 mx-auto rounded-full bg-green-500/20 border border-green-500/30 flex items-center justify-center mb-5">

                    <span class="text-4xl">
                        👤
                    </span>

                </div>

                <h1 class="text-3xl font-bold">
                    Accept Invitation
                </h1>

                <p class="text-gray-400 mt-2">
                    Complete your account to join the organization.
                </p>

            </div>


            <!-- Invitation Details -->

            <div class="space-y-4 mb-8">


                <div>

                    <label class="block text-sm text-gray-400 mb-2">
                        Email
                    </label>

                    <div class="bg-black/20 border border-white/10 rounded-lg px-4 py-3">
                        {{ invitation.email }}
                    </div>

                </div>


                <div>

                    <label class="block text-sm text-gray-400 mb-2">
                        Organization
                    </label>

                    <div class="bg-black/20 border border-white/10 rounded-lg px-4 py-3">
                        {{ invitation.organization.name }}
                    </div>

                </div>


                <div>

                    <label class="block text-sm text-gray-400 mb-2">
                        Role
                    </label>

                    <div class="bg-black/20 border border-white/10 rounded-lg px-4 py-3">
                        {{ invitation.role.name }}
                    </div>

                </div>


            </div>



            <!-- Registration Form -->

            <form method="post" class="space-y-6 invitation-form">

                {% csrf_token %}


                {{ form.as_p }}


                <button
                    type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 rounded-lg py-3 font-semibold transition"
                >

                    Create Account

                </button>


            </form>


        </div>

    </div>

</div>



<style>

.invitation-form p {

    margin-bottom: 1.25rem;

}


.invitation-form label {

    display: block;

    margin-bottom: 0.5rem;

    color: #d1d5db;

}


.invitation-form input {

    width: 100%;

    background: rgba(255,255,255,0.05);

    border: 1px solid rgba(255,255,255,0.1);

    border-radius: 0.5rem;

    padding: 0.75rem 1rem;

    color: white;

}


.invitation-form input:focus {

    outline: none;

    border-color: #22c55e;

}


.invitation-form ul {

    color: #f87171;

    font-size: 0.875rem;

    margin-top: 0.25rem;

}


</style>


{% endblock %}
