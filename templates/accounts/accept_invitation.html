{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>


<link
href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
rel="stylesheet">


<style>

body{
    font-family:'Plus Jakarta Sans',sans-serif;
}


.invitation-form p{
    margin-bottom:1.25rem;
}


.invitation-form label{

display:block;
margin-bottom:.5rem;
font-size:.875rem;
font-weight:600;
color:#334155;

}


.invitation-form input{

width:100%;
padding:.85rem 1rem;
border-radius:.9rem;
border:1px solid #cbd5e1;
background:#f8fafc;
transition:.3s;

}


.invitation-form input:focus{

outline:none;
background:white;
border-color:#4f46e5;
box-shadow:0 0 0 4px rgba(79,70,229,.12);

}


.invitation-form ul{

color:#ef4444;
font-size:.875rem;

}


</style>




<div class="
min-h-screen
bg-slate-50
py-12
px-5
">


<div class="
max-w-3xl
mx-auto
">



<div class="
bg-white
rounded-3xl
border
border-slate-200
shadow-xl
overflow-hidden
">



<div class="
h-1.5
bg-gradient-to-r
from-indigo-500
via-violet-500
to-cyan-500
">
</div>




<div class="p-10">





<!-- Header -->

<div class="text-center mb-10">


<div class="
w-24
h-24
mx-auto
rounded-3xl
bg-indigo-50
border
border-indigo-200
flex
items-center
justify-center
shadow-sm
">


<span class="text-5xl">

👤

</span>


</div>



<h1 class="
mt-6
text-3xl
font-extrabold
text-slate-900
">

Accept Invitation

</h1>



<p class="
mt-3
text-slate-500
">

Create your account and join your organization workspace.

</p>



</div>







<!-- Invitation Details -->


<div class="
grid
md:grid-cols-3
gap-5
mb-10
">



<div class="
rounded-2xl
bg-slate-50
border
border-slate-200
p-5
">


<p class="
text-sm
text-slate-500
mb-2
">

Email

</p>


<p class="
font-semibold
text-slate-900
break-all
">

{{ invitation.email }}

</p>


</div>






<div class="
rounded-2xl
bg-slate-50
border
border-slate-200
p-5
">


<p class="
text-sm
text-slate-500
mb-2
">

Organization

</p>


<p class="
font-semibold
text-slate-900
">

{{ invitation.organization.name }}

</p>


</div>







<div class="
rounded-2xl
bg-indigo-50
border
border-indigo-200
p-5
">


<p class="
text-sm
text-indigo-600
mb-2
">

Assigned Role

</p>


<span class="
inline-flex
px-3
py-1.5
rounded-xl
bg-indigo-100
text-indigo-700
font-semibold
text-sm
">

{{ invitation.role.name }}

</span>


</div>



</div>








<!-- Form -->


<div class="
border-t
border-slate-200
pt-8
">


<form 
method="post"
class="invitation-form"
>


{% csrf_token %}



{{ form.as_p }}





<button

type="submit"

class="
w-full
mt-5
py-4
rounded-xl
bg-indigo-600
hover:bg-indigo-700
text-white
font-semibold
shadow-lg
transition
duration-300
"

>

Create Account →

</button>



</form>


</div>







</div>


</div>



</div>



</div>


{% endblock %}
