{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>


<div class="min-h-screen bg-[#0F0B16] text-white flex items-center justify-center px-6 py-10">



<div class="w-full max-w-xl">



    <div class="bg-[#181320] border border-white/10 rounded-xl shadow-xl overflow-hidden">





        <!-- Header -->


        <div class="px-7 py-6 border-b border-white/10">


            <h2 class="text-2xl font-semibold">

                Create Role

            </h2>


            <p class="text-gray-400 text-sm mt-2">

                Create a custom role with specific permissions for your organization.

            </p>


        </div>







        <!-- Form -->


        <div class="p-7">



            <form method="post" class="space-y-6">


                {% csrf_token %}




                <div
                class="text-white

                [&_p]:mb-5


                [&_label]:block
                [&_label]:text-sm
                [&_label]:font-medium
                [&_label]:text-gray-300
                [&_label]:mb-2



                [&_input]:w-full
                [&_input]:px-4
                [&_input]:py-3
                [&_input]:rounded-lg
                [&_input]:bg-[#211A2D]
                [&_input]:border
                [&_input]:border-white/10
                [&_input]:text-white
                [&_input]:focus:outline-none
                [&_input]:focus:ring-2
                [&_input]:focus:ring-emerald-500/40



                [&_textarea]:w-full
                [&_textarea]:px-4
                [&_textarea]:py-3
                [&_textarea]:rounded-lg
                [&_textarea]:bg-[#211A2D]
                [&_textarea]:border
                [&_textarea]:border-white/10
                [&_textarea]:text-white
                [&_textarea]:focus:outline-none
                [&_textarea]:focus:ring-2
                [&_textarea]:focus:ring-emerald-500/40



                [&_select]:w-full
                [&_select]:px-4
                [&_select]:py-3
                [&_select]:rounded-lg
                [&_select]:bg-[#211A2D]
                [&_select]:border
                [&_select]:border-white/10
                [&_select]:text-white
                [&_select]:focus:outline-none
                [&_select]:focus:ring-2
                [&_select]:focus:ring-emerald-500/40

                ">



                    {{ form.as_p }}



                </div>







                <div class="flex gap-4 pt-2">



                    <button

                    type="submit"

                    class="flex-1 bg-emerald-600/80 hover:bg-emerald-600 text-white font-medium py-3 rounded-lg transition"

                    >

                        Save Role

                    </button>






                    <a

                    href="{% url 'role_list' %}"

                    class="flex-1 text-center bg-[#211A2D] border border-white/10 hover:bg-[#2A2238] text-gray-300 py-3 rounded-lg transition"

                    >

                        Cancel

                    </a>



                </div>




            </form>



        </div>



    </div>



</div>



</div>


{% endblock %}
