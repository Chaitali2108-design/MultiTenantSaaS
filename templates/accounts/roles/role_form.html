{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>


<div class="min-h-screen bg-gray-100 flex items-center justify-center px-6 py-10">



<div class="w-full max-w-xl">



    <div class="bg-white border border-gray-200 rounded-xl shadow-xl overflow-hidden">





        <!-- Header -->


        <div class="px-7 py-6 border-b border-gray-200">


            <h2 class="text-2xl font-semibold text-gray-800">

                Create Role

            </h2>


            <p class="text-gray-500 text-sm mt-2">

                Create a custom role with specific permissions for your organization.

            </p>


        </div>







        <!-- Form -->


        <div class="p-7">



            <form method="post" class="space-y-6">


                {% csrf_token %}





                <div
                class="text-gray-800

                [&_p]:mb-5


                [&_label]:block
                [&_label]:text-sm
                [&_label]:font-medium
                [&_label]:text-gray-700
                [&_label]:mb-2



                [&_input]:w-full
                [&_input]:px-4
                [&_input]:py-3
                [&_input]:rounded-lg
                [&_input]:bg-white
                [&_input]:border
                [&_input]:border-gray-300
                [&_input]:text-gray-800
                [&_input]:focus:outline-none
                [&_input]:focus:ring-2
                [&_input]:focus:ring-emerald-500/40



                [&_textarea]:w-full
                [&_textarea]:px-4
                [&_textarea]:py-3
                [&_textarea]:rounded-lg
                [&_textarea]:bg-white
                [&_textarea]:border
                [&_textarea]:border-gray-300
                [&_textarea]:text-gray-800
                [&_textarea]:focus:outline-none
                [&_textarea]:focus:ring-2
                [&_textarea]:focus:ring-emerald-500/40



                [&_select]:w-full
                [&_select]:px-4
                [&_select]:py-3
                [&_select]:rounded-lg
                [&_select]:bg-white
                [&_select]:border
                [&_select]:border-gray-300
                [&_select]:text-gray-800
                [&_select]:focus:outline-none
                [&_select]:focus:ring-2
                [&_select]:focus:ring-emerald-500/40

                ">



                    {{ form.as_p }}



                </div>








                <div class="flex gap-4 pt-2">





                    <button

                    type="submit"

                    class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-lg transition"

                    >

                        Save Role

                    </button>








                    <a

                    href="{% url 'role_list' %}"

                    class="flex-1 text-center bg-gray-100 border border-gray-300 hover:bg-gray-200 text-gray-700 py-3 rounded-lg transition"

                    >

                        Cancel

                    </a>




                </div>





            </form>



        </div>



    </div>



</div>



</div>


{% endblock %}
