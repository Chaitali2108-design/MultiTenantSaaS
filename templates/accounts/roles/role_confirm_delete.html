{% extends "base.html" %}

{% block content %}

<h2>
    Delete Role
</h2>

<p>
    Are you sure you want to delete
    <strong>{{ role.name }}</strong>?
</p>


<form method="post">

    {% csrf_token %}

    <button type="submit">
        Confirm Delete
    </button>


    <a href="{% url 'role_list' %}">
        Cancel
    </a>

</form>


{% endblock %}
