{% extends "base.html" %}

{% block content %}

<script src="https://cdn.tailwindcss.com"></script>


<div class="min-h-screen bg-gray-50 text-gray-900 flex items-center justify-center px-6 py-10">



<div class="w-full max-w-md">



    <div class="bg-white border border-gray-200 rounded-xl shadow-xl overflow-hidden">





        <!-- Header -->


        <div class="px-7 py-6 border-b border-gray-200 text-center">



            <div class="w-14 h-14 mx-auto mb-4 rounded-xl bg-red-100 border border-red-200 flex items-center justify-center">


                <svg
                    class="w-7 h-7 text-red-500"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">


                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 9v3m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z">
                    </path>


                </svg>


            </div>





            <h2 class="text-2xl font-semibold text-gray-800">

                Delete Role

            </h2>



            <p class="text-gray-500 text-sm mt-2">

                This action cannot be undone.

            </p>



        </div>








        <!-- Content -->


        <div class="p-7 text-center">



            <p class="text-gray-600 mb-6">


                Are you sure you want to delete


                <strong class="text-gray-900">

                    {{ role.name }}

                </strong>


                ?


            </p>







            <form method="post" class="flex gap-4">


                {% csrf_token %}




                <button

                type="submit"

                class="flex-1 bg-red-500 hover:bg-red-600 text-white font-medium py-3 rounded-lg transition shadow-sm"

                >

                    Confirm Delete

                </button>







                <a

                href="{% url 'role_list' %}"

                class="flex-1 bg-gray-100 border border-gray-200 hover:bg-gray-200 text-gray-700 py-3 rounded-lg transition"

                >

                    Cancel

                </a>




            </form>



        </div>



    </div>



</div>



</div>


{% endblock %}
