{% load static %}

<!DOCTYPE html>
<html>

<head>

    <script src="https://cdn.tailwindcss.com"></script>

    <title>
        {% block title %}
        Multi-Tenant SaaS
        {% endblock %}
    </title>


    <!-- Existing Frontend CSS (DO NOT CHANGE) -->

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/projects.css' %}">
    <link rel="stylesheet" href="{% static 'css/tasks.css' %}">
    <link rel="stylesheet" href="{% static 'css/kanban.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">


    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <!-- Member 2 Professional SaaS Styling Only -->

    <style>


    /* Main content area */

    main{

        width:100%;

    }



    /* Page headings */

    .page-title{

        font-size:26px;
        font-weight:700;
        color:#1e293b;
        margin-bottom:20px;

    }



    /* Professional cards */

    .saas-card{

        background:#ffffff;
        border:1px solid #e2e8f0;
        border-radius:12px;
        padding:24px;
        box-shadow:0 4px 15px rgba(15,23,42,0.06);
        margin-bottom:20px;

    }



    /* Buttons */

    .saas-btn{

        display:inline-block;
        background:#2563eb;
        color:white;
        padding:10px 18px;
        border-radius:8px;
        text-decoration:none;
        border:none;
        cursor:pointer;
        font-size:14px;

    }


    .saas-btn:hover{

        background:#1d4ed8;

    }




    /* Tables */

    .saas-table{

        width:100%;
        border-collapse:collapse;
        background:white;

    }



    .saas-table th{

        background:#f1f5f9;
        color:#475569;
        padding:14px;
        text-align:left;
        font-size:14px;

    }



    .saas-table td{

        padding:14px;
        border-bottom:1px solid #e2e8f0;
        color:#334155;

    }



    /* Status badges */

    .status-badge{

        padding:5px 12px;
        border-radius:20px;
        font-size:12px;
        font-weight:600;

    }



    .status-todo{

        background:#e2e8f0;
        color:#475569;

    }



    .status-progress{

        background:#dbeafe;
        color:#1d4ed8;

    }



    .status-done{

        background:#dcfce7;
        color:#15803d;

    }




    /* Priority */

    .priority-high{

        color:#dc2626;
        font-weight:600;

    }



    .priority-medium{

        color:#d97706;
        font-weight:600;

    }



    .priority-low{

        color:#16a34a;
        font-weight:600;

    }




    /* Progress bar */


    .progress-container{

        width:100%;
        height:8px;
        background:#e2e8f0;
        border-radius:20px;
        overflow:hidden;

    }



    .progress-value{

        height:100%;
        background:#2563eb;

    }



    </style>


</head>



<body>



    {% include 'components/navbar.html' %}



    <div class="page-wrapper">



        <div class="container">



            {% include 'components/sidebar.html' %}



            <main>



                {% block content %}

                {% endblock %}



            </main>



        </div>



        {% include 'components/footer.html' %}



    </div>



</body>

</html>
