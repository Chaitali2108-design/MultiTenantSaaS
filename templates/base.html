{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>
        {% block title %}
        Multi-Tenant SaaS
        {% endblock %}
        
    </title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/projects.css' %}">
    <link rel="stylesheet" href="{% static 'css/tasks.css' %}">
    <link rel="stylesheet" href="{% static 'css/kanban.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <link rel="stylesheet" href="{% static 'css/reports.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Hide scrollbar but keep scrolling */

.scrollbar-hide{
    -ms-overflow-style:none;
    scrollbar-width:none;
}

.scrollbar-hide::-webkit-scrollbar{
    width:0;
    height:0;
    display:none;
}
    </style>
</head>

<body>

    {% include 'components/navbar.html' %}

    <div class="layout">

        {% include 'components/sidebar.html' %}

        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>

    </div>
<!-- {% include 'components/footer.html' %}  -->
    

</body>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const btn = document.getElementById("notificationBtn");
    const dropdown = document.getElementById("notificationDropdown");
    const list = document.getElementById("notificationList");
    const countBadge = document.getElementById("notificationCount");

    // Toggle dropdown
    btn.addEventListener("click", () => {
        dropdown.classList.toggle("hidden");
        loadNotifications();
    });

    // Load notifications
    function loadNotifications() {
        fetch("/projects/notifications/")
            .then(res => res.json())
            .then(data => {

                list.innerHTML = "";

                if (data.notifications.length === 0) {
                    list.innerHTML = "<p class='p-3 text-gray-500'>No notifications</p>";
                    return;
                }

                data.notifications.forEach(n => {

                    const item = document.createElement("div");
                    item.className = "p-3 border-b hover:bg-gray-50 cursor-pointer";

                    item.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span>${n.message}</span>
                            ${!n.is_read ? '<span class="text-xs text-red-500">New</span>' : ''}
                        </div>
                    `;

                    // Mark as read
                    item.addEventListener("click", () => {
                        fetch(`/projects/notifications/read/${n.id}/`)
                            .then(() => {
                                item.remove();
                                updateCount();
                            });
                    });

                    list.appendChild(item);
                });

            });
    }

    // Load count
    function updateCount() {
        fetch("/projects/notifications/count/")
            .then(res => res.json())
            .then(data => {
                if (data.count > 0) {
                    countBadge.innerText = data.count;
                    countBadge.classList.remove("hidden");
                } else {
                    countBadge.classList.add("hidden");
                }
            });
    }

    // Initial count load
    updateCount();

    // Auto refresh count every 10s
    setInterval(updateCount, 10000);

});
</script>
</html>
