{% extends 'base.html' %}

{% block title %}
Settings
{% endblock %}

{% block content %}

<section>

    <h1>Settings</h1>

    <hr>

    <div class="cards">

        <div class="card">
            <h3>Account</h3>
            <p>Manage your account settings.</p>
        </div>

        <div class="card">
            <h3>Security</h3>
            <p>Change password and security options.</p>
        </div>

        <div class="card">
            <h3>Notifications</h3>
            <p>Email and system notifications.</p>
        </div>

        <div class="card">
            <h3>Theme</h3>
            <p>Light or Dark mode.</p>
        </div>

    </div>

    <hr>

    <button>Save Changes</button>

</section>

{% endblock %}
