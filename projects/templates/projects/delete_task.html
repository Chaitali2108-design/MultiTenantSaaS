{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card p-4">

        <h3>Delete Task</h3>

        <p>
            Are you sure you want to delete:
            <b>{{ task.title }}</b> ?
        </p>


        <form method="POST">

            {% csrf_token %}

            <button class="btn btn-danger">
                Delete
            </button>


            <a href="{% url 'tasks_list' %}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
