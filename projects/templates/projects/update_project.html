{% extends 'base.html' %}

{% block content %}

<style>

.edit-page{

    padding:25px;
    background:#f8fafc;

}

/* CARD */

.edit-card{

    max-width:600px;
    margin:auto;
    background:white;
    border-radius:16px;
    padding:30px;
    border:1px solid #e2e8f0;
    box-shadow:0 10px 25px rgba(15,23,42,0.08);

}

/* TITLE */

.edit-title{

    font-size:24px;
    font-weight:700;
    color:#0f172a;
    margin-bottom:25px;
    text-align:center;

}

/* INPUT */

.input-group{

    margin-bottom:18px;

}

.input-label{

    display:block;
    font-size:13px;
    color:#64748b;
    margin-bottom:6px;

}

.input-field{

    width:100%;
    padding:11px 12px;
    border-radius:8px;
    border:1px solid #e2e8f0;
    outline:none;
    font-size:14px;
    transition:.2s;

}

.input-field:focus{

    border-color:#2563eb;
    box-shadow:0 0 0 2px rgba(37,99,235,0.1);

}

/* BUTTON */

.update-btn{

    width:100%;
    background:#2563eb;
    color:white;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;

}

.update-btn:hover{

    background:#1d4ed8;

}

/* BACK LINK */

.back-link{

    display:block;
    text-align:center;
    margin-top:15px;
    color:#64748b;
    text-decoration:none;
    font-size:14px;

}

.back-link:hover{

    color:#2563eb;

}

</style>



<div class="edit-page">


<div class="edit-card">


<div class="edit-title">
✏ Edit Project
</div>


<form method="POST">

{% csrf_token %}


<div class="input-group">

<label class="input-label">Project Name</label>

<input 
type="text"
name="name"
value="{{ project.name }}"
class="input-field"
>

</div>



<div class="input-group">

<label class="input-label">Description</label>

<textarea 
name="description"
class="input-field"
rows="4"
>{{ project.description }}</textarea>

</div>



<div class="input-group">

<label class="input-label">Status</label>

<select name="status" class="input-field">

<option value="todo" {% if project.status == "todo" %}selected{% endif %}>
To Do
</option>

<option value="progress" {% if project.status == "progress" %}selected{% endif %}>
In Progress
</option>

<option value="done" {% if project.status == "done" %}selected{% endif %}>
Done
</option>

</select>

</div>



<div class="input-group">

<label class="input-label">Priority</label>

<select name="priority" class="input-field">

<option value="High" {% if project.priority == "High" %}selected{% endif %}>
High
</option>

<option value="Medium" {% if project.priority == "Medium" %}selected{% endif %}>
Medium
</option>

<option value="Low" {% if project.priority == "Low" %}selected{% endif %}>
Low
</option>

</select>

</div>



<button class="update-btn">
Update Project
</button>


</form>


<a href="{% url 'project_list' %}" class="back-link">
← Back to Projects
</a>


</div>


</div>


{% endblock %}
