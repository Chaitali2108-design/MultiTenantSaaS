{% extends 'base01.html' %}
{% block content %}

<div class="card">


<h2>Create Project</h2>

{% if error %}
    <p style="color:red">{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <input class="input" type="text" name="name" placeholder="Project Name" required>

    <textarea class="input" name="description" placeholder="Description" style="width:100%; height:80px;"></textarea>

    <select class="input" name="status">
        <option value="todo">To Do</option>
        <option value="progress">In Progress</option>
        <option value="done">Done</option>
    </select>

    <select class="input" name="priority">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
    </select>

    <input class="input" type="date" name="due_date">

    <button class="btn">Create Project</button>

</form>


</div>

{% endblock %}
