<h1>Create Project</h1>

{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}
    <input type="text" name="name" placeholder="Project Name"><br><br>
    <textarea name="description" placeholder="Description"></textarea><br><br>
    <button type="submit">Create</button>
</form>
