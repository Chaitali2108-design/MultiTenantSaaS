<!DOCTYPE html>
<html>

<head>

<title>Secure Multi Tenant SaaS</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:20px;
    color:#1f2937;
}


.container{
    width:90%;
    margin:auto;
}


.navbar{
    background:white;
    padding:18px;
    border-radius:12px;
    margin-bottom:25px;
    border:1px solid #e5e7eb;
    display:flex;
    gap:25px;
}


.navbar a{
    text-decoration:none;
    color:#374151;
    font-weight:600;
}


.navbar a:hover{
    color:#2563eb;
}


.card{
    background:white;
    padding:25px;
    border-radius:12px;
    border:1px solid #e5e7eb;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
}


h1,h2,h3{
    color:#111827;
}


.btn{
    background:#2563eb;
    color:white;
    padding:10px 18px;
    border-radius:8px;
    text-decoration:none;
    border:none;
    cursor:pointer;
}


.btn:hover{
    background:#1d4ed8;
}


.input{
    width:180px;
    height:38px;
    padding:8px 12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    margin-right:10px;
    background:white;
    font-size:14px;
}

form{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
}

table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
}


th{
    background:#f8fafc;
    padding:14px;
    text-align:left;
    color:#374151;
}


td{
    padding:14px;
    border-bottom:1px solid #e5e7eb;
}


tr:hover{
    background:#f9fafb;
}


.progress{
    width:160px;
    height:10px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}


.progress-bar{
    height:10px;
    border-radius:20px;
}

td,th{
    word-wrap:break-word;
}


th{
    background:#f3f4f6;
    padding:14px;
    text-align:left;
}


td{
    padding:14px;
    border-bottom:1px solid #e5e7eb;
}


tr:hover{
    background:#f9fafb;
}


.progress{
    width:150px;
    height:12px;
    background:#e5e7eb;
    border-radius:10px;
    overflow:hidden;
}


.progress-bar{
    height:12px;
    max-width:100%;
    border-radius:10px;
}

.badge{
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}


.done{
    background:#dcfce7;
    color:#166534;
}


.progress-badge{
    background:#fef3c7;
    color:#92400e;
}


.todo{
    background:#fee2e2;
    color:#991b1b;
}


</style>

</head>


<body>


<div class="container">


<div class="navbar">
    

<a href="/projects/">Projects</a>

<a href="/projects/tasks/">Tasks</a>

<a href="/projects/kanban/">Kanban</a>

</div>

{% block content %}

{% endblock %}

</div>

</body>

</html>
